<!doctype html>
<html lang="en" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title data-i18n="settingsTitle">Get Joke · Settings</title><link rel="icon" href="../images/icon-32.png"><link rel="stylesheet" href="../styles/style.css"><script src="../scripts/i18n.js" defer></script><script src="../scripts/core.js" defer></script><script src="options.js" defer></script></head>
<body class="options-page"><main class="options-shell">
  <header class="options-header"><a href="../index.html" class="brand brand-link"><img src="../images/icon-48.png" width="40" height="40" alt=""><h1>get joke<span class="brand-dot">.</span></h1></a><span class="page-label" data-i18n="settings">Settings</span></header>
  <div class="options-intro"><p class="eyebrow" data-i18n="settingsEyebrow">A SENSE OF HUMOR, YOUR WAY</p><h2><span data-i18n="settingsHeadline">Make it your kind of funny</span><span class="brand-dot">.</span></h2><p data-i18n="settingsIntro">Pick your topics. Find your next smile.</p></div>
  <form id="settings-form"><fieldset id="settings-fields" class="settings-fields" disabled>
    <section class="settings-section"><div class="section-heading"><h3><span class="section-number">01</span> <span data-i18n="categoriesTitle">Your kind of jokes</span></h3><button id="all-categories" class="text-button" type="button" data-i18n="selectAvailable">Select available</button></div><div class="category-grid">
      <label class="category-choice"><input aria-describedby="category-note" type="checkbox" name="category" value="Programming"><span data-i18n="catProgramming">Programming</span></label><label class="category-choice"><input aria-describedby="category-note" type="checkbox" name="category" value="Misc"><span data-i18n="catMisc">Everyday humor</span></label><label class="category-choice"><input aria-describedby="category-note" type="checkbox" name="category" value="Pun"><span data-i18n="catPun">Puns</span></label><label class="category-choice"><input aria-describedby="category-note" type="checkbox" name="category" value="Spooky"><span data-i18n="catSpooky">Spooky</span></label><label class="category-choice"><input aria-describedby="category-note" type="checkbox" name="category" value="Christmas"><span data-i18n="catChristmas">Christmas</span></label><label class="category-choice"><input aria-describedby="category-note" type="checkbox" name="category" value="Dark"><span data-i18n="catDark">Dark</span></label>
    </div><p id="category-note" class="field-note" data-i18n="categoryNote">Only available categories can be selected.</p><p id="category-adjustment" class="field-note category-adjustment" role="status"></p></section>
    <section class="settings-section"><h3><span class="section-number">02</span> <span data-i18n="preferencesTitle">A few preferences</span></h3><div class="preferences-grid"><div class="field"><label for="language" data-i18n="jokeLanguage">Joke language</label><select id="language" name="lang"><option value="en">English</option><option value="cs">Čeština</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option></select></div><div class="field"><label for="theme" data-i18n="appearance">Appearance</label><select id="theme" name="theme"><option value="system" data-i18n="themeSystem">Match my device</option><option value="light" data-i18n="themeLight">Light</option><option value="dark" data-i18n="themeDark">Dark</option></select></div></div><label class="toggle-row"><span><strong data-i18n="safeMode">Safe mode</strong><small data-i18n="safeModeHelp">Filters explicit content. Dark jokes are unavailable in Safe mode.</small></span><input id="safe-mode" type="checkbox" role="switch"></label><label class="toggle-row"><span><strong data-i18n="hidePunchline">Save the punchline</strong><small data-i18n="hidePunchlineHelp">Reveal the answer when you’re ready.</small></span><input id="hide-punchline" type="checkbox" role="switch"></label></section>
    <div class="save-row"><p id="save-status" role="status" aria-live="polite" data-i18n="loadingSettings">Loading your settings…</p><button id="save-settings" class="save-button" type="submit"><span data-i18n="saveSettings">Save settings</span> <span aria-hidden="true">↗</span></button></div>
  </fieldset></form>
  <div id="settings-error" class="notice" role="alert" hidden></div><button id="retry-settings" class="text-button" type="button" data-i18n="retrySettings" hidden>Try loading settings again</button><footer class="options-footer"><span>Get Joke · <span data-i18n="byAuthor">by MarkAlexI</span></span><a href="../privacy.html" data-i18n="privacyAndApi">Privacy &amp; JokeAPI</a></footer>
</main></body></html>
